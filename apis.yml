name: Fractyl Health
description: 'Fractyl Health, Inc. (Nasdaq: GUTS) is a clinical-stage metabolic therapeutics
  company developing treatments that target the root causes of type 2 diabetes and obesity rather
  than managing symptoms. Its lead product, Revita, is an outpatient endoscopic procedure that
  resurfaces the duodenal lining to address a driver of metabolic disease, and Rejuva is an
  early-stage pancreatic islet-cell gene therapy platform designed for durable, one-time metabolic
  remission. The company is headquartered in Massachusetts and backed by Bessemer Venture Partners
  and General Catalyst. Fractyl publishes no public developer API, SDK, or developer portal; this
  API Evangelist profile tracks its corporate, product, and investor web presence.'
